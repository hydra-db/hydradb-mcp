name: CI

on:
  # Every pull request, not only those targeting main.
  #
  # This was `pull_request: branches: [main]`, which means a PR opened against
  # any other branch got NO checks at all — and an empty check list looks a lot
  # like a passing one. Stacked pull requests target the layer below them rather
  # than main, so an entire stack could sit "green" without a single test having
  # run on it.
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check-types

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Deliberately `npm test` and nothing else. This step used to inline
      # `shopt -s globstar` under bash, which meant CI was exercising a
      # different command from the one contributors run — and covered for the
      # fact that `npm test` itself matched no files under /bin/sh.
      - name: Run unit tests
        run: npm test

  dco-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch for commit range
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_REF"

      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          failed=0
          for sha in $(git rev-list "$BASE_SHA"..HEAD); do
            if ! git log -1 --format='%B' "$sha" | grep -q "^Signed-off-by: "; then
              echo "❌ Commit $sha is missing a DCO sign-off:"
              git log -1 --format='  %h %s' "$sha"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "All commits must include a Signed-off-by line."
            echo ""
            echo "To fix the most recent commit:"
            echo "  git commit --amend -s"
            echo ""
            echo "To fix all commits in this PR:"
            echo "  git rebase --signoff $BASE_SHA"
            exit 1
          fi
          echo "✅ All commits have DCO sign-off."
